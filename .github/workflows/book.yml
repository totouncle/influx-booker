name: Influx Auto Booker
run-name: Influx ${{ inputs.dispatch_key }}

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [check, book]
        default: check
        required: true
      opening_date:
        description: Auckland opening date (YYYY-MM-DD), not the class date
        required: true
        type: string
      target_index:
        description: Zero-based schedule.json entry
        required: true
        type: string
      account_index:
        description: 0=Kibum, 1=Haejin
        required: true
        type: string
      dispatch_key:
        description: Unique run label used by the dispatcher
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: influx-${{ inputs.mode }}-${{ inputs.opening_date }}-${{ inputs.target_index }}-${{ inputs.account_index }}
  cancel-in-progress: false

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENING_DATE: ${{ inputs.opening_date }}
      TARGET_INDEX: ${{ inputs.target_index }}
      ACCOUNT_INDEX: ${{ inputs.account_index }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only check
        if: inputs.mode == 'check'
        run: node book.js check --opening-date "$OPENING_DATE" --target-index "$TARGET_INDEX" --account-index "$ACCOUNT_INDEX" --output check-result.json
        env:
          INFLUX_TOKEN_1: ${{ secrets.INFLUX_TOKEN_1 }}
          INFLUX_TOKEN_2: ${{ secrets.INFLUX_TOKEN_2 }}
      - name: Prepare booking
        id: prepare
        if: inputs.mode == 'book'
        run: node book.js prepare --opening-date "$OPENING_DATE" --target-index "$TARGET_INDEX" --account-index "$ACCOUNT_INDEX" --output prepared.json
        env:
          INFLUX_TOKEN_1: ${{ secrets.INFLUX_TOKEN_1 }}
          INFLUX_TOKEN_2: ${{ secrets.INFLUX_TOKEN_2 }}
      - name: Ready to book
        if: inputs.mode == 'book' && steps.prepare.outputs.booking_ready == 'true'
        run: echo 'Session resolved; waiting for the Auckland opening time.'
      - name: Book at opening
        if: inputs.mode == 'book'
        run: node book.js book --opening-date "$OPENING_DATE" --target-index "$TARGET_INDEX" --account-index "$ACCOUNT_INDEX" --prepared prepared.json --output booking-result.json
        env:
          INFLUX_TOKEN_1: ${{ secrets.INFLUX_TOKEN_1 }}
          INFLUX_TOKEN_2: ${{ secrets.INFLUX_TOKEN_2 }}
      - name: Report booking
        if: always() && inputs.mode == 'book'
        run: node book.js alert --opening-date "$OPENING_DATE" --target-index "$TARGET_INDEX" --account-index "$ACCOUNT_INDEX" --prepared prepared.json --result booking-result.json
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: influx-${{ inputs.dispatch_key }}-${{ github.run_id }}
          path: |
            check-result.json
            prepared.json
            booking-result.json
          if-no-files-found: ignore
          retention-days: 30
